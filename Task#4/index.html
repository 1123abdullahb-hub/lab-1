<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - DOM & BOM Multi-State Interaction</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; color: #333; transition: background-color 0.4s; }
        .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        h1, h2 { color: #007bff; }
    </style>
</head>
<body>

    <div class="section">
        <h1 id="mainHeading">Welcome to Task 4</h1>
        <p id="mainParagraph">Click the buttons below to see multi-state (5+ unique clicks) DOM and BOM actions.</p>
    </div>

    <div class="section">
        <h2>DOM Manipulation (5 Unique States)</h2>
        <button onclick="changeTextSequence()">Change Text Content</button>
        <button onclick="changeColorSequence()">Change Background Color</button>
        <button onclick="changeDateSequence()">Show Date & Time</button>
    </div>

    <div class="section">
        <h2>BOM Features (5 Unique States)</h2>
        <button onclick="openWindowSequence()">Open New Window</button>
        <button onclick="closeWindowSequence()">Close Window</button>
        <button onclick="showInfoSequence()">Show Browser Info</button>
        <button onclick="navigateSequence()">Navigate History</button>
    </div>

    <script>
        // --- DOM MULTI-STATE LOGIC (5+ UNIQUE RESPONSES) ---
        let textStep = 0;
        function changeTextSequence() {
            const h1 = document.getElementById('mainHeading');
            const p = document.getElementById('mainParagraph');
            const states = [
                { h: "State 1: Introduction", body: "You clicked the text button for the 1st time." },
                { h: "State 2: Exploring DOM", body: "Second click: Dynamic elements are updating successfully." },
                { h: "State 3: Multi-State Logic", body: "Third click: Changing content sequentially based on click count." },
                { h: "State 4: Advanced Scripting", body: "Fourth click: Approaching the final state sequence." },
                { h: "State 5: Sequence Complete", body: "Fifth click: Cycle complete! Click again to restart the sequence." }
            ];
            h1.textContent = states[textStep].h;
            p.textContent = states[textStep].body;
            textStep = (textStep + 1) % states.length;
        }

        let colorStep = 0;
        function changeColorSequence() {
            const colors = ["#ffadad", "#ffd6a5", "#fdffb6", "#caffbf", "#9bf6ff"];
            document.body.style.backgroundColor = colors[colorStep];
            document.getElementById('mainParagraph').textContent = `Background changed to state ${colorStep + 1}: ${colors[colorStep]}`;
            colorStep = (colorStep + 1) % colors.length;
        }

        let dateStep = 0;
        function changeDateSequence() {
            const p = document.getElementById('mainParagraph');
            const now = new Date();
            const formats = [
                `Local Time: ${now.toLocaleTimeString()}`,
                `UTC Time: ${now.toUTCString()}`,
                `Date Only: ${now.toDateString()}`,
                `ISO String: ${now.toISOString()}`,
                `Timestamp: ${now.getTime()} ms`
            ];
            p.textContent = `[Click ${dateStep + 1}] ${formats[dateStep]}`;
            dateStep = (dateStep + 1) % formats.length;
        }

        // --- BOM MULTI-STATE LOGIC (5+ UNIQUE RESPONSES) ---
        let openedWindow = null;
        let bomStep = 0;
        function openWindowSequence() {
            const urls = [
                "https://www.google.com",
                "https://www.github.com",
                "https://www.wikipedia.org",
                "https://www.stackoverflow.com",
                "https://developer.mozilla.org"
            ];
            const targetUrl = urls[bomStep];
            openedWindow = window.open(targetUrl, "_blank", "width=600,height=400");
            document.getElementById('mainParagraph').textContent = `[State ${bomStep + 1}] Opened tab: ${targetUrl}`;
            bomStep = (bomStep + 1) % urls.length;
        }

        let closeStep = 0;
        function closeWindowSequence() {
            const p = document.getElementById('mainParagraph');
            if (openedWindow && !openedWindow.closed) {
                openedWindow.close();
                p.textContent = `[Close State ${closeStep + 1}] Successfully closed the active popup window.`;
            } else {
                p.textContent = `[Close State ${closeStep + 1}] No active window is currently open to close.`;
            }
            closeStep = (closeStep + 1) % 5;
        }

        let infoStep = 0;
        function showInfoSequence() {
            const p = document.getElementById('mainParagraph');
            const infoStates = [
                `Screen Width: ${window.screen.width}px`,
                `Screen Height: ${window.screen.height}px`,
                `Browser Platform: ${navigator.platform}`,
                `Language: ${navigator.language}`,
                `User Agent: ${navigator.userAgent}`
            ];
            p.textContent = `[Info State ${infoStep + 1}] ${infoStates[infoStep]}`;
            infoStep = (infoStep + 1) % infoStates.length;
        }

        let navStep = 0;
        function navigateSequence() {
            const p = document.getElementById('mainParagraph');
            const navActions = [
                "Navigated back 1 step (history.back())",
                "Navigated forward 1 step (history.forward())",
                "Reloaded current page (history.go(0))",
                "Jumped back 2 steps in history",
                "History length status checked: Total entries = " + history.length
            ];
            
            // Executing safe simulated navigation actions based on state
            if (navStep === 0) history.back();
            else if (navStep === 1) history.forward();
            else if (navStep === 2) location.reload();
            
            p.textContent = `[Navigation State ${navStep + 1}] ${navActions[navStep]}`;
            navStep = (navStep + 1) % navActions.length;
        }
    </script>
</body>
</html>
